minimizer_references:
  - AB047639
  - GU814263
  - GU814265
  - AF064490
  - EU246939
  - EF108306
  - MH590698

# All file paths below are relative to the `nextclade` directory
files:
  # Curated output of the ingest workflow
  metadata: "../ingest/results/metadata.tsv"
  sequences: "../ingest/results/sequences.fasta"
  reference: "defaults/reference.fasta"
  annotation: "defaults/annotation.gff"
  pathogen_json: "defaults/pathogen.json"
  # Manual genotype/subtype annotations that augment/override the NCBI ones
  genotype_annotations: "defaults/genotype_annotations.tsv"
  # Accessions that are always included/excluded in the subsample
  include: "defaults/include.txt"
  exclude: "defaults/exclude.txt"
  auspice_config: "defaults/auspice_config.json"
  # Genotype/subtype colors, generated with scripts/generate-colors.py
  colors: "defaults/colors.tsv"
  # README and CHANGELOG of the Nextclade dataset
  dataset_readme: "defaults/README.md"
  dataset_changelog: "defaults/CHANGELOG.md"

strain_id_field: "accession"

# Subsampling of near full length genomes evenly across genotypes/subtypes
subsample:
  # minimal length of the sequence (number of valid nucleotides)
  min_length: 8000
  # only use sequences with a genotype annotation, and drop (mostly lab) recombinants
  query: "genotype != '' & genotype != 'recombinant' & is_lab_host != 'true'"
  group_by: ["genotype", "subtype"]
  sequences_per_group: 10
  # random seed for reproducible subsampling
  seed: 0

# Example sequences shipped with the dataset: near full length genomes that are
# not in the tree, evenly across genotypes and subtypes
examples:
  min_length: 8000
  query: "genotype != '' & genotype != 'recombinant' & is_lab_host != 'true'"
  group_by: ["genotype", "subtype"]
  sequences_per_group: 3
  seed: 0

# Alignment regions (0-based, end exclusive, reference coordinates) that are
# masked before tree building. These are regions with >30% gaps in the
# alignment, identified with `scripts/find-gappy-regions.py` during set-up,
# and should match `placementMaskRanges` in the pathogen.json.
mask_ranges:
  - {begin: 2045, end: 2070}
  - {begin: 7035, end: 7060}
  - {begin: 7380, end: 7490}
  - {begin: 7560, end: 7590}
  - {begin: 9375, end: 9599}

tree:
  tree_builder_args: "-czb"

ancestral:
  inference: "joint"
  genes: ["core", "E1", "E2", "p7", "NS2", "NS3", "NS4A", "NS4B", "NS5A", "NS5B"]

# Tree-based annotation of genotypes/subtypes (scripts/assign-clades.py): for
# each metadata field, the MRCA of each value is labeled and the value is
# assigned to all downstream nodes as the given node attribute.
assign_clades:
  genotype:
    attribute: "clade_membership"
  subtype:
    attribute: "subtype"

export:
  metadata_columns: ["genotype", "subtype", "ncbi_genotype", "ncbi_subtype", "ncbi_virus_name", "country", "date", "length", "url"]
